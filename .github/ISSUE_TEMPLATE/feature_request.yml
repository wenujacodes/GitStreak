name: ✨ Feature Request
description: Suggest a new feature or improvement for GitStreak
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe your idea so we can evaluate and prioritize it.

  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: Is your feature request related to a problem? Describe the pain point or motivation.
      placeholder: I'm frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution or feature you'd like to see.
      placeholder: It would be great if GitStreak could...
    validations:
      required: false

  - type: dropdown
    id: feature-area
    attributes:
      label: Feature Area
      description: Which part of GitStreak does this relate to?
      options:
        - Desktop Widget
        - Main App UI
        - OAuth & Authentication
        - Color Themes
        - Settings / Preferences
        - Auto-Update (Sparkle)
        - Other
    validations:
      required: true

  - type: textarea
    id: mockups
    attributes:
      label: Mockups / References
      description: If you have any mockups, sketches, or references from other apps, attach them here.
    validations:
      required: false
