name: Release and Update Appcast

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. v1.2.0)'
        required: true
        default: 'v1.2.0'

jobs:
  build-and-release:
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set Release Tag & Build Number
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          BUILD_NUMBER=$(git rev-list --count HEAD)
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.x'

      - name: Install Tools
        run: |
          brew install xcodegen create-dmg

      - name: Download Sparkle Tools
        run: |
          mkdir -p sparkle_tools
          curl -sL https://github.com/sparkle-project/Sparkle/releases/download/2.6.4/Sparkle-2.6.4.tar.xz | tar -xf - -C sparkle_tools

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build GitStreak Release
        run: |
          xcodebuild -project GitStreak.xcodeproj \
            -scheme GitStreak \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath ./build \
            MARKETING_VERSION=${{ steps.vars.outputs.version }} \
            CURRENT_PROJECT_VERSION=${{ steps.vars.outputs.build_number }} \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            build

      - name: Package Release Artifacts (ZIP and DMG)
        run: |
          mkdir -p release_artifacts
          cd build/Build/Products/Release
          zip -r -y ../../../../release_artifacts/GitStreak-${{ steps.vars.outputs.tag }}.zip GitStreak.app
          cd ../../../..

          create-dmg \
            --volname "GitStreak Installer" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "GitStreak.app" 175 190 \
            --hide-extension "GitStreak.app" \
            --app-drop-link 425 190 \
            "release_artifacts/GitStreak-${{ steps.vars.outputs.tag }}.dmg" \
            "build/Build/Products/Release/GitStreak.app" || true

      - name: Sign Archive & Update Appcast
        id: appcast
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          ZIP_FILE="release_artifacts/GitStreak-${{ steps.vars.outputs.tag }}.zip"
          ZIP_SIZE=$(stat -f%z "$ZIP_FILE")
          ZIP_URL="https://github.com/wenujacodes/GitStreak/releases/download/${{ steps.vars.outputs.tag }}/GitStreak-${{ steps.vars.outputs.tag }}.zip"
          
          SIGNATURE=""
          if [ -n "$SPARKLE_KEY" ]; then
            SIGNATURE=$(echo "$SPARKLE_KEY" | ./sparkle_tools/bin/sign_update -s - "$ZIP_FILE" | grep -o 'sparkle:edSignature="[^"]*"' | cut -d'"' -f2 || true)
          fi

          python3 scripts/update_appcast.py appcast.xml "${{ steps.vars.outputs.version }}" "${{ steps.vars.outputs.build_number }}" "$ZIP_URL" "$ZIP_SIZE" "$SIGNATURE"

      - name: Commit & Push Updated Appcast
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          if git diff --staged --quiet; then
            echo "No changes to appcast.xml"
          else
            git commit -m "chore(release): update appcast.xml for ${{ steps.vars.outputs.tag }} [skip ci]"
            git push origin main
          fi

      - name: Check If Release Already Exists
        id: check_release
        run: |
          if gh release view "${{ steps.vars.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        if: steps.check_release.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: GitStreak ${{ steps.vars.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_artifacts/GitStreak-${{ steps.vars.outputs.tag }}.dmg
            release_artifacts/GitStreak-${{ steps.vars.outputs.tag }}.zip
