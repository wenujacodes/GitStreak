name: Release and Update Appcast

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. v1.0.1)'
        required: true
        default: 'v1.0.1'

jobs:
  build-and-release:
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Release Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.x'

      - name: Install Tools
        run: |
          brew install xcodegen create-dmg

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build GitStreak Release
        run: |
          xcodebuild -project GitStreak.xcodeproj \
            -scheme GitStreak \
            -configuration Release \
            -derivedDataPath ./build \
            MARKETING_VERSION=${{ steps.vars.outputs.version }} \
            build

      - name: Package Release Artifacts (ZIP and DMG)
        run: |
          mkdir -p release_artifacts
          cd build/Build/Products/Release
          zip -r -y ../../../../release_artifacts/GitStreak-${{ steps.vars.outputs.tag }}.zip GitStreak.app
          cd ../../../..

          create-dmg \
            --volname "GitStreak Installer" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "GitStreak.app" 175 190 \
            --hide-extension "GitStreak.app" \
            --app-drop-link 425 190 \
            "release_artifacts/GitStreak-${{ steps.vars.outputs.tag }}.dmg" \
            "build/Build/Products/Release/GitStreak.app" || true

      - name: Check If Release Already Exists
        id: check_release
        run: |
          if gh release view "${{ steps.vars.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        if: steps.check_release.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: GitStreak ${{ steps.vars.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_artifacts/GitStreak-${{ steps.vars.outputs.tag }}.dmg
            release_artifacts/GitStreak-${{ steps.vars.outputs.tag }}.zip
