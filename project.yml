name: GitStreak
options:
  bundleIdPrefix: com.gitstreak
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  objectVersion: 56

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "YES"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.1.5"
    CURRENT_PROJECT_VERSION: 7

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0

targets:
  GitStreak:
    type: application
    platform: macOS
    sources:
      - path: GitStreak
        excludes:
          - "**/.DS_Store"
          - "Info.plist"
    dependencies:
      - target: GitStreakKit
        link: true
      - target: GitStreakWidgetExtension
        embed: true
      - package: Sparkle
        product: Sparkle
    info:
      path: GitStreak/Info.plist
      properties:
        SUFeedURL: "https://raw.githubusercontent.com/wenujacodes/GitStreak/main/appcast.xml"
        SUPublicEDKey: "hAVQuxYqxeSviYywMbrjWCd4roJqK4RWfJ3pnpL9934="
        SUEnableAutomaticChecks: true
        SUAllowsAutomaticUpdates: true
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gitstreak.GitStreak
        CODE_SIGN_ENTITLEMENTS: GitStreak/GitStreak.entitlements
        CURRENT_PROJECT_VERSION: 7
        MARKETING_VERSION: "1.1.5"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  GitStreakWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: GitStreakWidget
        excludes:
          - "**/.DS_Store"
          - "Info.plist"
    dependencies:
      - target: GitStreakKit
        link: true
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: GitStreakWidget/Info.plist
      properties:
        CFBundleDisplayName: "GitStreak"
        NSExtension:
          NSExtensionPointIdentifier: "com.apple.widgetkit-extension"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gitstreak.GitStreak.Widget
        CODE_SIGN_ENTITLEMENTS: GitStreakWidget/GitStreakWidget.entitlements
        GENERATE_INFOPLIST_FILE: "YES"
        CURRENT_PROJECT_VERSION: 7
        MARKETING_VERSION: "1.1.5"
        PRODUCT_NAME: GitStreakWidgetExtension
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  GitStreakKit:
    type: framework
    platform: macOS
    sources:
      - path: GitStreakKit
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gitstreak.GitStreakKit
        GENERATE_INFOPLIST_FILE: "YES"
        CURRENT_PROJECT_VERSION: 7
        MARKETING_VERSION: "1.1.5"
        DEFINES_MODULE: "YES"
        PRODUCT_MODULE_NAME: GitStreakKit

  GitStreakTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: GitStreakTests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: GitStreakKit
        link: true
      - target: GitStreak
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gitstreak.GitStreakTests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/GitStreak.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/GitStreak"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  GitStreak:
    build:
      targets:
        GitStreak: all
        GitStreakWidgetExtension: all
        GitStreakKit: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GitStreakTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
